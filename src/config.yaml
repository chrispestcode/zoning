paths:  # relative to the project root (the folder with pyproject.toml)
  data: corpus
  evals: evals
  database: document_database.db
  review_queue: logs/review_queue.jsonl   # IDs that failed to load, for human review
  logs:
    evals: logs/evals
  test: test_path

urls:
  qdrant-host: http://localhost:6333
  ollama-host: http://127.0.0.1:11435/api/generate

models:
  provider: claude   # ollama | claude (claude reads ANTHROPIC_API_KEY)
  ollama: qwen3:8b
  claude: claude-sonnet-4-6
  embedding_model: BAAI/bge-large-en-v1.5
